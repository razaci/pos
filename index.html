Seventh Door'},{x:14.5,y:3,type:'rest',name:'The seventh-day seat'});for(let x=7;x<27;x+=4)objects.push({x,y:8.5,type:'pillar'})}$('place').textContent=names[d];$('objective').textContent=state.ended?'Doorway restored · Free exploration':`Signals restored ${state.signals.length}/3 · Find the author`;save()}function wall(x,y){let ix=Math.floor(x),iy=Math.floor(y);return ix<1||ix>=29||iy<1||iy>=10||(iy===3||iy===7)&&ix>6&&ix<27&&ix%4===0}function resize(){W=cv.width=Math.min(innerWidth,1000);H=cv.height=Math.round(W*innerHeight/innerWidth)}onresize=resize;resize();function show(html){paused=true;$('panel').style.display='grid';$('content').innerHTML=html+'<p><button onclick="closePanel()">Continue exploring</button></p>'}function closePanel(){paused=false;$('panel').style.display='none';keys={}}function toast(s){$('toast').textContent=s;$('toast').style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').style.opacity=0,4500)}function menu(){show(`<small>FIELD JOURNAL</small><h2>The Seventh Door</h2><p>Restore the rainbow, whale-song, and dream stations in that order. Enter the pyramid from the upper promenade. Discover what the author needs to come home.</p><p>Signals: ${state.signals.length}/3 · Recovered pages: ${state.pages.length}/6</p><p>Move: WASD or touch arrows. Turn: arrow keys or drag the view. Approach glowing blue orbs and press E or the action button. Progress saves on this device.</p><button onclick="mapView()">Deck map</button><button onclick="readAloud()">Read this journal aloud</button><button onclick="restart()">New adventure</button><p style="font-size:11px">An original fictional adventure inspired by the books of BRIAN CHAPMAN SR MSP A+ CIW. This playable interpretation does not reproduce an unseen CAD plan.</p>`)}function readAloud(){if('speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance($('content').innerText))}else toast('Speech is unavailable in this browser.')}function restart(){show('<h2>Start again?</h2><p>This clears the saved adventure on this device.</p><button onclick="state={deck:5,x:4.5,y:5.5,a:0,signals:[],pages:[],ended:false};setup();closePanel()">Start a new adventure</button>')}function mapView(){show('<h2>Ark deck directory</h2><p>Each deck shares a central passage with wooden ribs, side bays, and a staircase at the west end. Stations stand halfway along their decks. Recovered pages wait at the east end.</p>'+names.slice(0,6).map((n,i)=>`<p>${i+1}. ${n}${[2,3,4].includes(i)?' · Signal station':''}</p>`).join('')+'<p>Pyramid access: upper promenade, central passage.</p>')}function travel(d){state.deck=d;state.x=4.5;state.y=5.5;state.a=0;setup();closePanel();toast(names[d])}function interact(){if(!near){toast('Move toward a small blue light.');return}let o=near,d=state.deck;if(o.type==='lift')show('<h2>Wooden stairwell</h2><p>Choose a landing.</p>'+names.slice(0,6).map((n,i)=>`<button onclick="travel(${i})">${i+1} · ${n}</button>`).join(''));if(o.type==='page'){if(!state.pages.includes(d))state.pages.push(d);save();show('<small>RECOVERED MANUSCRIPT</small><h2>'+names[d]+'</h2><p>'+notes[d]+'</p>')}if(o.type==='portal'){if(true)goComplex();else show('<h2>The unlit passage</h2><p>Three carved symbols remain dark: a rainbow, a whale, and a sleeping eye. Restore their stations to open the route beneath the pyramid.</p>')}if(o.type==='return')travel(5);if(o.type==='signal'){let idx=d-2;if(state.signals.includes(idx)){toast('This station is restored.');return}if(state.signals.length!==idx){toast('The inscription says: sky, then sea, then dream.');return}let puzzles=[['Rainbow bands','Which sequence follows the rainbow from its outer red band inward?',['Red → orange → yellow → green → blue → indigo → violet','Violet → green → red → blue','Blue → yellow → violet → red']],['Ocean memory','The archive repeats: low, low, high. Which echo answers it?',['Low · low · high','High · high · low','Low · high · low']],['The unfinished sunset','The simulation repeats six days of work. What completes the cycle?',['A day of rest','More power','Another machine']]][idx];show('<small>SIGNAL '+(idx+1)+'</small><h2>'+puzzles[0]+'</h2><p>'+puzzles[1]+'</p>'+puzzles[2].map((a,i)=>`<button onclick="answer(${idx},${i})">${a}</button>`).join(''))}if(o.type==='rest'){state.rested=true;save();show('<h2>The still hour</h2><p>You sit. The rushing instruments fall quiet. In the silence, a seventh pulse arrives without any machine producing it. A voice whispers, “Now you can hear me.”</p>')}if(o.type==='door'){if(!state.rested){show('<h2>A hand beyond the glass</h2><p>The author presses his palm against the doorway. Every instrument is running, but his words cannot cross. A wooden seat stands nearby beneath seven unlit stars.</p>')}else{state.ended=true;save();setup();show('<small>CHAPTER COMPLETE</small><h2>The doorway opens</h2><p>You leave the instruments still. One by one, seven stars brighten above the threshold.</p><p>The author steps into the chamber carrying a book with no last page. Lazara takes his hand. Behind him lies a garden with two empty chairs.</p><p>“It never needed more power,” he says. “It needed someone willing to wait.”</p><p>Far beneath the pyramid, something turns a page.</p><p><b>Adventure complete.</b> You can keep exploring and recover the remaining manuscript pages.</p>')}}}function answer(idx,n){if(n!==0){toast('The pattern slips. Read the clue and try again.');return}if(!state.signals.includes(idx))state.signals.push(idx);setup();closePanel();toast(['Rainbow signal restored. Find the whale-song archive.','Ocean signal restored. Find the simulation gallery.','Dream signal restored. Return to the upper promenade.'][idx])}
function render(t){let dt=Math.min((t-last)/1000,.05)||0;last=t;if(!paused){state.a+=((keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0))*dt*1.8;let f=(keys.w?1:0)-(keys.s?1:0),ss=(keys.d?1:0)-(keys.a?1:0),sp=dt*3;let nx=state.x+(Math.cos(state.a)*f-Math.sin(state.a)*ss)*sp,ny=state.y+(Math.sin(state.a)*f+Math.cos(state.a)*ss)*sp;let can=(x,y)=>!wall(x-.22,y-.22)&&!wall(x+.22,y+.22)&&!wall(x-.22,y+.22)&&!wall(x+.22,y-.22);if(can(nx,state.y))state.x=nx;if(can(state.x,ny))state.y=ny}updateStoryQuest(dt,t);drawScene(t);requestAnimationFrame(render)}

function challengeView(){let g=challenge;if(!g)return;let b=bibleData[g.id],sc=sceneRows[g.id],a=adventureState(g.id),body='';const btn=(label,action,cls='')=>`<button class="${cls}" onclick="${action}">${label}</button>`;let instruction='';if(g.mode==='trail'){instruction='Guide the traveler from the top-left to the flag at the bottom-right. Move to a neighboring square; dark rocks block the route.';body='<div class="challenge-grid">'+Array.from({length:25},(_,i)=>btn(i===g.pos?'●':i===24?'⚑':g.blocked.includes(i)?'▰':'·',`trailMove(${i})`,g.blocked.includes(i)?'wall':g.path.includes(i)?'lit':'')).join('')+'</div>'}if(g.mode==='balance'){instruction=`Balance the three work baskets at exactly ${g.target} units each. Each basket changes independently.`;body=g.values.map((v,i)=>`<p>Basket ${i+1}: <b>${v}/${g.target}</b> ${btn('−',`basket(${i},-1)`)} ${btn('+',`basket(${i},1)`)}</p>`).join('')}if(g.mode==='order'){instruction='Repair the plan by arranging the five marked pieces from 1 to 5. Tap neighboring arrow buttons to swap pieces.';body='<div class="challenge-grid">'+g.tiles.map(v=>btn(v+1,'',v===g.tiles.indexOf(v)?'lit':'')).join('')+'</div>'+[0,1,2,3].map(i=>btn(`Swap ${i+1} ↔ ${i+2}`,`swapOrder(${i})`)).join('')}if(g.mode==='lanterns'){instruction='Restore all nine lamps. Tapping a lamp switches it and its horizontal and vertical neighbors.';body='<div class="challenge-grid" style="grid-template-columns:repeat(3,1fr)">'+g.values.map((v,i)=>btn(v?'☀':'○',`toggleLantern(${i},true)`,v?'lit':'')).join('')+'</div>'}if(g.mode==='dial'){instruction='Align the three display rings with the reference marks. These are game mechanisms, not biblical instructions.';body=g.values.map((v,i)=>`<p>Ring ${i+1}: <b>${v}</b> → reference <b>${g.sequence[i]}</b> ${btn('Turn',`turnDial(${i})`)}</p>`).join('')}if(g.mode==='supplies'){instruction=`Pack exactly ${g.target} supply units without exceeding the load. Choose parcels; you can empty and retry.`;body=`<h2>${g.total}/${g.target} arget", 1], ["Carry the shepherd banner", "Bring the record of the brook to the valley banner.", "deliver", "banner", 1], ["Recover the witness accounts", "Find three scroll fragments telling the event.", "gather", "scroll", 3], ["Restore the account", "Arrange the three panels against their reference marks.", "fit", "scroll", 3], ["Read the valley ending", "Reach the last marker for the ending of 1 Samuel 17.", "finish", "banner", 1]]], ["The good Samaritan", "A neighbor on the road", [["Find the roadside traveler", "Approach the traveler and read Jesus' parable. The care actions in this game are symbolic.", "talk", "person", 1], ["Gather the care parcels", "Collect three symbolic comfort parcels along the lane.", "gather", "basket", 3], ["Bring a comfort parcel", "Deliver the parcel to the traveler without simulated medical procedures.", "deliver", "basket", 1], ["Clear the safe route", "Find three route markers around the roadside obstacles.", "gather", "riverstone", 3], ["Guide the traveler toward the inn", "The traveler follows as you walk along the central lane to the inn beacon.", "escort", "person", 1], ["Arrange the inn supplies", "Match the shelf pieces to the reference marks.", "fit", "basket", 3], ["Speak with the innkeeper", "Choose how to arrange ongoing help for the guest.", "talk", "person", 1], ["Leave the door open", "At the inn gate, read the question: who was a neighbor?", "finish", "house", 1]]], ["Mary at the empty tomb", "The name in the garden", [["Approach the moved stone", "Mary finds the stone removed. Explore the tomb garden before reading the witness account.", "walk", "tomb", 1], ["Find the linen markers", "Locate three linen-display markers.", "gather", "linen", 3], ["Speak beside the garden path", "Read Mary's words of grief and choose a compassionate response.", "talk", "person", 1], ["Restore the garden account", "Align the three witness panels.", "fit", "scroll", 3], ["Hear the spoken name", "Return to the garden figure to read the on court", "Read the passage's description of the city's light and open gates.", "finish", "goldgate", 1]]]];
const authoredQuests=new Map();authoredQuestRows.forEach(([title,subtitle,steps])=>{let id=bibleData.findIndex(b=>b.title===title);if(id>=0)authoredQuests.set(id,{subtitle,steps})});
state.storyQuests=state.storyQuests||{};let storyQuestOn=false,escortActive=false,questAimTime=0;
function questState(){state.storyQuests=state.storyQuests||{};return state.storyQuests[activeStory]||(state.storyQuests[activeStory]={step:0,collected:[],inventory:[],choices:[],finished:false})}
const adventureWorldSetup=setup;setup=function(){adventureWorldSetup();if(!storyQuestOn||state.deck!==7||!authoredQuests.has(activeStory))return;let q=questState(),def=authoredQuests.get(activeStory),step=def.steps[Math.min(7,q.step)];objects.length=0;objects.push({x:3.5,y:5.5,type:'questMenu',name:'Quest map and inventory'});for(let j=0;j<12;j++)objects.push({x:6+j*1.7,y:j%2?9:1.2,type:destinationPlan(bibleData[activeStory],sceneRows[activeStory]).props[j%3]});if(step[2]==='gather'){let n=step[4];for(let i=0;i<n;i++)if(!q.collected.includes(i))objects.push({x:7+i*3,y:i%2?6.3:4.1,type:'questObject',item:i,landmark:step[3],name:step[0]+' '+(q.collected.length+1)+'/'+n})}else if(step[2]==='escort'){objects.push({x:q.escortX||6,y:q.escortY||5.5,type:'questEscort',landmark:step[3],name:escortActive?'Companion is following':'Begin guiding the companion'},{x:25,y:5.5,type:'questBeacon',landmark:'house',name:'Companion destination'})}else objects.push({x:23,y:5.5,type:'questObject',landmark:step[3],name:step[0]});if(q.finished)objects.push({x:13,y:5.5,type:'questReplay',name:'Adventure completed · view journal',landmark:'scroll'});$('place').textContent=sceneRows[activeStory].name;$('objective').textContent=`Story quest ${Math.min(8,q.step+1)}/8 · ${q.finished?'Complete':step[0]}`;save()};
const generalEnterStory=enterStory;enterStory=function(id){storyQuestOn=false;escortActive=false;generalEnterStory(id);if(authoredQuests.has(id)){storyQuestOn=true;setup();showQuestIntro()}};
function showQuestIntro(){let q=questState(),def=authoredQuests.get(activeStory),step=def.steps[Math.min(q.step,7)];show(`<small>AUTHORED STORY QUEST · ${bibleData[activeStory].ref}</small><h2>${def.subtitle}</h2><p>${bibleData[activeStory].text}</p><p><b>${q.finished?'Quest complete':step[0]}</b></p><p>${q.finished?'You can revisit the scene or try its extended challenge stages.':step[1]}</p><p style="font-size:12px">Exploration, dialogue choices, item gathering, and puzzles are added game scenes inspired by the cited account.</p><button onclick="closePanel()">${q.finished?'Explore again':'Continue story quest'}</button><button onclick="questJournal()">Map & inventory</button><button onclick="extendedAdventure()">Extended challenge stages</button>`)}
function extendedAdventure(){storyQuestOn=false;escortActive=false;setup();closePanel();toast('Extended adventure mode · 12 stages')}
function questJournal(){let q=questState(),def=authoredQuests.get(activeStory),step=def.steps[Math.min(7,q.step)];show(`<h2>${def.subtitle}</h2><p>Step ${Math.min(q.step+1,8)}/8 · ${step[0]}</p><p>${step[1]}</p><p>Inventory: ${q.inventory.length?q.inventory.join(', '):'Empty'}</p><p>Current finds: ${q.collected.length}/${step[2]==='gather'?step[4]:1}</p><p>Choices recorded: ${q.choices.length}</p><p>Blue task markers are ahead along the central path. Gathering sites alternate left and right. Companions follow along the central lane to the eastern shelter.</p><button onclick="closePanel()">Return to the scene</button><button onclick="extendedAdventure()">Extended stages</button><button onclick="directory()">Other places</button>`)}
function finishQuestStep(){let q=questState(),def=authoredQuests.get(activeStory),old=def.steps[q.step];if(q.finished)return;q.inventory.push(old[0]+' ✓');q.collected=[];q.escortX=null;q.escortY=null;escortActive=false;q.step++;if(q.step>=8){q.finished=true;q.step=7;save();setup();show(`<small>STORY QUEST COMPLETE</small><h2>${def.subtitle}</h2><p>${bibleData[activeStory].text}</p><p>Your completed tasks and choices remain in this destination's inventory.</p><button onclick="questJournal()">View quest journal</button><button onclick="extendedAdventure()">Play extended challenges</button><button onclick="authoredDirectory()">More story quests</button>`);return}save();setup();let step=def.steps[q.step];show(`<small>QUEST ${q.step+1}/8</small><h2>${step[0]}</h2><p>${step[1]}</p><button onclick="closePanel()">Continue on foot</button>`)}
const allAdventureInteract=interact;interact=function(){if(!storyQuestOn||state.deck!==7||!near)return allAdventureInteract();let o=near,q=questState(),def=authoredQuests.get(activeStory),step=def.steps[q.step];if(o.type==='questMenu'||o.type==='questReplay'){questJournal();return}if(q.finished){toast('This story quest is complete. Open its journal for more adventures.');return}if(o.type==='questBeacon'){if(!escortActive)toast('Meet the companion at the western end first.');else toast('Bring your companion here along the central lane.');return}if(o.type==='questEscort'){escortActive=true;closePanel();toast('Walk toward the eastern shelter. Your companion follows.');return}if(o.type!=='questObject')return;if(step[2]==='gather'){if(!q.collected.includes(o.item))q.collected.push(o.item);save();if(q.collected.length===step[4])finishQuestStep();else{setup();toast('Collected '+q.collected.length+'/'+step[4])}return}if(step[2]==='talk'){show(`<h2>${step[0]}</h2><p>${step[1]}</p><p>${bibleData[activeStory].text}</p><button onclick="questChoice('Listen carefully')">Listen carefully</button><button onclick="questChoice('Offer help')">Offer help</button><button onclick="questChoice('Ask about the journey')">Ask about the journey</button>`);return}if(step[2]==='fit'){q.fit=q.fit||[2,0,1];questFit();return}if(step[2]==='aim'){questAimTime=-Math.PI/4;show(`<h2>Practice target</h2><p>Tap Release when the indicator is between 40 and 60. There is no penalty for retrying.</p><h2 id="aimValue">0</h2><button onclick="questAimRelease()">Release</button>`);return}finishQuestStep()};
function questChoice(choice){let q=questState();q.choices.push({step:q.step,choice});save();show(`<h2>${choice}</h2><p>${choice==='Offer help'?'You offer practical support. The traveler accepts and points toward the next task.':choice==='Listen carefully'?'You stay to hear the account before moving on. Its reference is recorded in your journal.':'The traveler explains the next part of the route. You mark the task sites in your journal.'}</p><button onclick="finishQuestStep()">Continue the story</button>`)}
function questFit(){let q=questState();show(`<h2>Fit the three pieces</h2><p>Turn each piece until it matches its marked reference.</p>${q.fit.map((v,i)=>`<p>Piece ${i+1}: ${['↑','→','↓','←'][v]} · Reference ${['↑','→','↓'][i]} <button onclick="questTurn(${i})">Turn</button></p>`).join('')}`)}
function questTurn(i){let q=questState();q.fit[i]=(q.fit[i]+1)%4;if(q.fit.every((v,i)=>v===i)){q.fit=null;finishQuestStep()}else questFit()}
function questAimRelease(){let val=Math.round((Math.sin(questAimTime*2)+1)*50);if(val>=40&&val<=60)finishQuestStep();else toast('Try again when the indicator is between 40 and 60.')}
function updateStoryQuest(dt,t){if(!storyQuestOn||state.deck!==7||!authoredQuests.has(activeStory))return;let q=questState();if(paused&&$('aimValue')){questAimTime+=dt;$('aimValue').textContent=Math.round((Math.sin(questAimTime*2)+1)*50)}if(!escortActive||paused||q.finished)return;let o=objects.find(o=>o.type==='questEscort');if(!o)return;let dx=state.x-o.x,dy=state.y-o.y,dist=Math.hypot(dx,dy);if(dist>1){let nx=o.x+dx/dist*dt*2,ny=o.y+dy/dist*dt*2;if(!wall(nx,ny)){o.x=nx;o.y=ny;q.escortX=nx;q.escortY=ny}}if(Math.hypot(o.x-25,o.y-5.5)<1.7)finishQuestStep()}
const priorDrawQuestProp=drawProp;drawProp=function(kind,id){if(kind!=='person'){priorDrawQuestProp(kind,id);return}ctx.fillStyle='#d6b18d';ctx.beginPath();ctx.arc(0,-.68,.11,0,7);ctx.fill();ctx.fillStyle=['#779eae','#b49d7c','#91ab91'][id%3];ctx.beginPath();ctx.moveTo(-.1,-.55);ctx.lineTo(.1,-.55);ctx.lineTo(.2,.17);ctx.lineTo(-.2,.17);ctx.closePath();ctx.fill();ctx.fillStyle='#655e4b';ctx.fillRect(-.12,.17,.09,.12);ctx.fillRect(.03,.17,.09,.12)};
function authoredDirectory(){show(`<h2>Story quests</h2><p>Twelve authored routes add characters, gathering, deliveries, escorting, dialogue, and story-specific endings. Extended challenge stages remain available in every destination.</p>${[...authoredQuests].map(([id,q])=>`<button style="display:block;width:100%;text-align:left" onclick="enterStory(${id})">${state.storyQuests[id]?.finished?'✓':'◇'} ${q.subtitle}<br><small>${bibleData[id].title}</small></button>`).join('')}`)}
const olderAdventureMenu=adventureMenu;adventureMenu=function(){olderAdventureMenu();$('content').insertAdjacentHTML('afterbegin','<p><button onclick="authoredDirectory()">New story quests · 12 adventures</button></p>');if(storyQuestOn)$('content').insertAdjacentHTML('afterbegin','<p><button onclick="questJournal()">Current story quest & inventory</button></p>')};
setup();

const beforeQuestChanges=setup;setup=function(){beforeQuestChanges();if(!storyQuestOn||state.deck!==7||!authoredQuests.has(activeStory))return;let q=questState(),b=bibleData[activeStory],sc=sceneRows[activeStory];if(b.title==='The Ark and the rainbow'){objects.push({x:18,y:2.4,type:'ark'});if(q.step>=3)objects.push({x:18,y:8.5,type:'animal'});if(q.finished){sc.kind='garden';objects.push({x:26,y:5,type:'rainbow'})}}if(b.book==='Ruth'&&q.step>=2){objects.push({x:11,y:2.5,type:'table'},{x:11,y:3,type:'bread'})}if(b.title==="The lions' den"&&q.step>=6){sc.kind='garden';objects.push({x:25,y:3,type:'gate'})}if(b.title==='The reluctant messenger'){sc.kind=q.step<3?'sea':q.step<5?'night':q.step<7?'city':'garden';objects.push({x:18,y:2,type:q.step<3?'boat':q.step<5?'fish':q.step<7?'citygate':'vine'})}if(b.title==='The sea opens'&&q.step>=4){objects.push({x:14,y:2,type:'waterwall'},{x:14,y:8,type:'waterwall'})}if(b.title==='Mary at the empty tomb'&&q.step>=4){sc.kind='garden';objects.push({x:17,y:2,type:'flower'},{x:21,y:8,type:'radiance'})}if(q.finished)objects.push({x:20,y:8,type:'banner'})};setup();
